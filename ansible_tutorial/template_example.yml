---
 - name: copy software
   hosts: all
   tasks:
   - name: copy software
     copy: 
      src: /home/vagrant/prometheus-2.47.0.linux-amd64.tar.gz
      dest: /usr/local/bin
   - name: unarchive module
     unarchive:
       src: /usr/local/bin/prometheus-2.47.0.linux-amd64.tar.gz
       dest: /usr/local/bin
       remote_src: yes

   - name: template module
     template:
       src: /home/vagrant/prometheus.service.j2
       dest: /etc/systemd/prometheus.service
   - name: start prometheus 
     service: 
       name: prometheus.service
       state: started
