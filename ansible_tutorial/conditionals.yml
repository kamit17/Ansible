---
 - name: install multiple softwares
   hosts: all
   gather_facts: true
   tasks:
     - name: install multiple softwares on a host server
       yum:
         name: "{{ item }}"
         state: latest
       when: (ansible_facts['distribution'] == "CentOS" and ansible_facts['distribution_major_version'] =="7")
       loop:
        - git
        - docker
        - python3
        - git
