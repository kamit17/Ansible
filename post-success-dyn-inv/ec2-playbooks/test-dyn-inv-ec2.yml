---
- hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Create the EC2 Instance
      ec2:
        region: ap-south-1
        group: default
        key_name: 14Feb2019 
        instance_type: t2.micro
        image: ami-0f18d198eb9022e38
        vpc_subnet_id: subnet-a388c0cb
        assign_public_ip: yes
        wait: yes
        wait_timeout: 600
        instance_tags:
           Name: apache
      register: ec2

    - name: Refresh inventory to ensure new instances exist in inventory	
      meta: refresh_inventory
  

