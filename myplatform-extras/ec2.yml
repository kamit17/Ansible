---
- 
  hosts: localhost
  connection: local
  gather_facts: false

  
  tasks:
    - name: Create a security group in AWS for SSH access and HTTP
      ec2_group:
         name: ansible
         description: Ansible Security Group
         region: ap-south-1
         rules:
            - proto: all
              from_port: all
              to_port: all
              cidr_ip: 0.0.0.0/0
            - proto: tcp
              from_port: 22
              to_port: 22
              cidr_ip: 0.0.0.0/0

    - name: Provision a set of instances
      ec2:
         key_name: 14Feb2019
         group: ansible
         instance_type: t2.micro
         image: ami-0d3e51d72921848f7 
         region: ap-south-1
         wait: true
         exact_count: 2
         count_tag:
            Name: AnsibleNginxWebservers
         instance_tags:
            Name: Ansible
      register: ec2
      ignore_errors: true

    - name: Add all instance public IPs to host group
      add_host:
        hostname: "{{ item.public_ip }}"
        groups: ansiblehosts
      with_items: "{{ ec2.instances }}"

    - name: Show group
      debug:
        var: groups.ansiblehosts


...

