---
- hosts: all
  become: yes
  vars:
    user: "{{ ansible_env.USER }}"

  tasks:
    - name: print facts
      debug: 
        msg: "ansible_env.USER: {{ ansible_env.USER }}"

    - name: Create root file
      file:
        path: /tmp/my_file_root
        state: touch

    - name: Create user file
      become_user: "{{ user }}"
      file:
        path: /tmp/my_file_{{ user }}
        state: touch


